<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360">
  <title>WCAGpilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
  <style>
    /* Critical inline styles to prevent FOUC */
    body { margin: 0; font-family: 'Inter', sans-serif; }
    .section { display: block; }
    .hidden { display: none !important; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 10px; font-size: 14px; border: none; cursor: pointer; }
    .btn-icon { width: 20px; height: 20px; flex-shrink: 0; }
  </style>
</head>
<body>

  <!-- 1. LOGIN — populated by server -->
  <section id="login-section" class="section hidden"></section>

  <!-- 2. ONBOARDING — populated by server -->
  <section id="onboard-section" class="section hidden"></section>

  <!-- 3. HOME — populated by server -->
  <section id="home-section" class="section hidden"></section>

  <!-- 4. LOADING (hardcoded - shows on startup and during check) -->
  <section id="loading-section" class="section">
    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-left">
        <svg class="logo-sm" width="24" height="24" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <rect x="4" y="4" width="56" height="56" rx="14" fill="#E8F5E1"/>
          <rect x="12" y="14" width="40" height="8" rx="4" fill="#1A1A2E"/>
          <rect x="12" y="28" width="32" height="8" rx="4" fill="#636B74"/>
          <rect x="12" y="42" width="24" height="8" rx="4" fill="#2D7A0E"/>
        </svg>
        <span class="wordmark wordmark-sm"><span class="wordmark-wcag">WCAG</span><span class="wordmark-pilot">pilot</span></span>
      </div>
    </div>

    <div class="loading-content">
      <div class="spinner" role="status" aria-label="Analyzing"></div>
      <p class="loading-title" id="loading-text" data-i18n="ui.loading">Analyzing...</p>
      <p class="loading-hint" data-i18n="ui.loading_hint">Usually takes 10–30 seconds</p>
      <p class="loading-warning" data-i18n="ui.loading_warning">Do not close this window</p>
    </div>
  </section>

  <!-- 5. RESULT — populated by server -->
  <section id="result-section" class="section hidden"></section>

  <!-- 6. HISTORY — populated by server -->
  <section id="history-section" class="section hidden"></section>

  <!-- 7. PROFILE — populated by server -->
  <section id="profile-section" class="section hidden"></section>

  <!-- 8. LIMIT — populated by server -->
  <section id="limit-section" class="section hidden"></section>

  <!-- 9. ERROR — populated by server -->
  <section id="error-section" class="section hidden"></section>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
